name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run /setup
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Bot version
      placeholder: "3.0.0"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node -v`
      placeholder: "v24.x"
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Where does it run?
      placeholder: "Own VPS, panel host, Docker, ..."
  - type: textarea
    id: logs
    attributes:
      label: Console output
      description: Paste any error from the bot's console. Remove your token if it appears.
      render: text
